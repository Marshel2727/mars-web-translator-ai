<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Mars Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="header-title">
        <span class="logo-icon">🪐</span>
        <h1>Mars Translator</h1>
      </div>
      <span class="version-badge">v1.1</span>
    </div>

    <!-- Server Status -->
    <div class="status-bar" id="serverStatus">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Memeriksa server...</span>
    </div>

    <!-- Model Selector Section -->
    <div class="model-section">
      <h3 class="section-title">Model Ollama</h3>
      <div class="select-wrapper">
        <select id="modelSelect" disabled>
          <option value="">Memuat daftar model...</option>
        </select>
      </div>
    </div>


    <!-- Action Buttons -->
    <div class="actions-section">
      <button id="translateVisibleBtn" class="btn btn-primary">
        <span class="btn-icon">🌐</span>
        <span class="btn-label">Translate Visible Text</span>
      </button>
      <button id="checkSubtitleBtn" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
        <span class="btn-icon">🔎</span>
        <span class="btn-label">Cek Subtitle Video</span>
      </button>
      <button id="restoreBtn" class="btn btn-success">
        <span class="btn-icon">↩️</span>
        <span class="btn-label">Restore Original</span>
      </button>
      <button id="restoreSubtitleBtn" class="btn btn-warning" style="display:none;">
        <span class="btn-icon">⏪</span>
        <span class="btn-label">Restore Subtitle</span>
      </button>
      <button id="testApiBtn" class="btn btn-secondary">
        <span class="btn-icon">🔌</span>
        <span class="btn-label">Test API Connection</span>
      </button>
    </div>

    <!-- Video Info Section -->
    <div class="video-section" id="videoInfoSection" style="display:none;">
      <h3 class="section-title">Info Video</h3>
      <div class="video-info-grid" id="videoInfoGrid">
        <div class="video-info-row"><span class="info-label">Platform</span><span class="info-value" id="viPlatform">—</span></div>
        <div class="video-info-row"><span class="info-label">Video</span><span class="info-value" id="viVideoCount">—</span></div>
        <div class="video-info-row"><span class="info-label">Subtitle</span><span class="info-value" id="viSubtitleDetected">—</span></div>
        <div class="video-info-row"><span class="info-label">Format</span><span class="info-value" id="viFormat">—</span></div>
        <div class="video-info-row"><span class="info-label">Load via</span><span class="info-value" id="viLoadMethod">—</span></div>
        <div class="video-info-row"><span class="info-label">Status</span><span class="info-value" id="viStatus">—</span></div>
        <div class="video-info-row video-tracks-row" id="viTracksRow" style="display:none;">
          <span class="info-label">Tracks</span>
          <span class="info-value" id="viTracks">—</span>
        </div>
      </div>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
      <h3 class="section-title">Statistik</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="cacheCount">—</span>
          <span class="stat-label">Cache Items</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="serverCacheCount">—</span>
          <span class="stat-label">Server Cache</span>
        </div>
      </div>
    </div>

    <!-- Result Section -->
    <div class="result-section">
      <h3 class="section-title">Status</h3>
      <div class="result-box" id="result">Belum ada aksi.</div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <a href="#" id="openOptionsLink" class="footer-link">⚙️ Pengaturan</a>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
